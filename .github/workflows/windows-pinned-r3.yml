name: Verify the pinned Qwen Windows installer end to end

on:
  push:
    branches:
      - validation/windows-pinned-r3

permissions:
  contents: read

env:
  CANDIDATE_TAG: windows-2026-11-21-r3
  CANDIDATE_SHA256: '433a4e27a3ea0e93d6b13d5982f8cfc19ca6cfd0e4f3e23cff1af27b5db8e3d7'
  CANDIDATE_ASSET_ID: '775767785'

jobs:
  fetch-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      # GitHub restricts unpublished drafts to identities with push access.
      # This job only reads the nominated asset. It never checks out or runs project code.
      - name: Download the exact candidate from the release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="skanfdt/KioskAI"
          test "$GITHUB_REPOSITORY" = "$repository"
          release_id=$(gh release view "$CANDIDATE_TAG" --repo "$repository" --json databaseId --jq .databaseId)
          test "$release_id" = '453733205'
          actual_id=$(gh api "repos/$repository/releases/$release_id/assets" --jq '.[] | select(.name=="KioskAI-Setup.exe") | .id')
          test "$actual_id" = "$CANDIDATE_ASSET_ID"
          gh release download "$CANDIDATE_TAG" --repo "$repository" --pattern KioskAI-Setup.exe --dir "$RUNNER_TEMP/candidate"
          cd "$RUNNER_TEMP/candidate"
          printf '%s  %s\n' "$CANDIDATE_SHA256" KioskAI-Setup.exe | sha256sum --check
      - name: Pass the candidate to the separate Windows guest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate/KioskAI-Setup.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  install-and-order:
    needs: fetch-draft
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out independent test tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download the installer alone onto the new guest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: ${{ runner.temp }}/verified-release-candidate
      - name: Verify empty Windows, run the installer normally and verify all model files
        timeout-minutes: 38
        run: |
          $env:EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'kiosk-evidence'
          & ./checks/Install-Fresh.ps1
      - name: Verify the order and a single trusted card selection on the practice kiosk
        timeout-minutes: 46
        run: |
          $env:EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'kiosk-evidence'
          $python = Join-Path (Split-Path -Parent $env:KIOSKAI_TEST_APP) 'python/python.exe'
          & $python -E -s -B -X utf8 ./checks/smoke.py
          exit $LASTEXITCODE
      - name: Preserve independent installation and order evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-windows-proof
          path: |
            ${{ runner.temp }}/kiosk-evidence/*.json
            ${{ runner.temp }}/kiosk-evidence/*.png
          if-no-files-found: warn
          retention-days: 14
